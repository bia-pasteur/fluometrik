# Demo config: `pixi run -e dev python demos/augmentations.py --config demos/demo.yaml`
entries:
  - image: samples/sample_0.tif
    preset: heavy
    resolution: 0.11
  - image: samples/sample_1.png
    channels: [0,1]
    preset: heavy
    resolution: 0.37
  - image: samples/sample_0.tif
    preset: default
    resolution: 0.11
  - image: samples/sample_1.png
    channels: [0,1]
    preset: default
    resolution: 0.37
  - image: samples/sample_0.tif
    preset: fast
    resolution: 0.11
  - image: samples/sample_1.png
    channels: [0,1]
    preset: fast
    resolution: 0.37
samples_per_op: 4
show: false
