# Publishes fluometrik to PyPI on every `v*` tag push, using PyPI trusted
# publishing (OIDC): no API tokens are stored anywhere.
#
# One-time setup on pypi.org (before the first upload):
#   Account settings -> Publishing -> Add a new pending publisher
#     PyPI project name: fluometrik
#     Owner: bia-pasteur   Repository: fluometrik
#     Workflow: publish.yml   Environment: pypi
#
# For a TestPyPI rehearsal instead: add
#   with: {repository-url: https://test.pypi.org/legacy/}
# to the publish step and register the same pending publisher on
# test.pypi.org (separate account).

name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {} # least privilege; the publish job adds id-token: write

jobs:
  build:
    name: Build sdist & wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi # must match the pending publisher's environment name
    permissions:
      id-token: write # the OIDC claim PyPI trusts
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
