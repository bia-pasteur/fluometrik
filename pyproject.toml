[project]
authors = [{name = "Julie Mabon"}]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]
name = "fluometrik"
description = "Photometric augmentation for fluo|bio-images"
readme = "README.md"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
fluometrik = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
numpy = ">=2.5.3,<3"
scipy = ">=1.18.1,<2"
pytest = ">=9.1.1,<10"

[tool.pixi.environments.dev.dependencies]
matplotlib = ">=3.11.2,<4"
imageio = ">=2.38.0,<3"
jsonargparse = ">=4.40.2,<5"
rich = ">=15.0.0,<16"


